<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বাকির খাতা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F5;--sf:#fff;--ink:#1B2227;--mut:#5E6A72;--ln:#D9E0E3;--red:#A4262C;--grn:#1E6B4F;--rb:#FBEDEC;--gb:#E7F3EE;--rbtn:#A4262C;--gbtn:#1E6B4F;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181B;--sf:#1B2327;--ink:#E8EEF0;--mut:#9AA8AF;--ln:#2D393F;--red:#F08A8F;--grn:#6FCFA6;--rb:#2B1B1D;--gb:#17281F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181B;--sf:#1B2327;--ink:#E8EEF0;--mut:#9AA8AF;--ln:#2D393F;--red:#F08A8F;--grn:#6FCFA6;--rb:#2B1B1D;--gb:#17281F;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;padding:16px 16px 96px}
main{max-width:560px;margin:0 auto}
h2{font-size:18px;margin:24px 0 8px;font-weight:600}
p{margin:0}
.hero{background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--red);border-radius:6px;padding:18px 18px 16px;background-image:repeating-linear-gradient(transparent 0 33px,var(--ln) 33px 34px)}
.hero .lab{color:var(--mut);font-size:16px}
.hero .big{font-size:44px;font-weight:700;line-height:1.3;color:var(--red)}
.hero .sub{color:var(--mut);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:8px;padding:10px 14px;font:600 17px inherit;font-family:inherit;color:#fff;background:var(--ink);cursor:pointer;text-align:center;text-decoration:none}
.btn.give{background:var(--rbtn)}.btn.get{background:var(--gbtn)}
.btn.ghost{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}
.btn:focus-visible,.row:focus-visible,#nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--grn);outline-offset:2px}
.list{list-style:none;margin:0;padding:0;background:var(--sf);border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.list li+li{border-top:1px solid var(--ln)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 14px;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.red{color:var(--red);font-weight:700}.grn{color:var(--grn);font-weight:700}.mut{color:var(--mut)}
.empty{color:var(--mut);padding:14px 2px}
label{display:block;font-weight:500;margin:14px 0 4px}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:8px}
textarea{min-height:90px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:50px;border-radius:8px;border:2px solid var(--ln);background:var(--sf);color:var(--ink);font:600 17px inherit;font-family:inherit;cursor:pointer}
.seg button.on[data-type="give"]{border-color:var(--red);background:var(--rb);color:var(--red)}
.seg button.on[data-type="get"]{border-color:var(--grn);background:var(--gb);color:var(--grn)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-top:12px}
.stat{display:flex;justify-content:space-between;padding:10px 0}.stat+.stat{border-top:1px solid var(--ln)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.head h1{font-size:24px;margin:0;line-height:1.3}
.tx{display:flex;justify-content:space-between;gap:10px;padding:10px 14px}
.tx small{display:block;color:var(--mut);font-size:14px}
.del{background:none;border:0;color:var(--mut);font:inherit;font-size:14px;padding:6px 0;cursor:pointer;text-decoration:underline}
.link{background:none;border:0;color:var(--grn);font:600 16px inherit;font-family:inherit;padding:8px 0;cursor:pointer}
.brand{display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto 14px}.brand svg{flex:none;border-radius:12px}
.st{font-size:14px;color:var(--mut);max-width:560px;margin:0 auto 10px}.st.bad{color:var(--red)}
#nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#nav button{min-height:56px;background:none;border:0;border-top:3px solid transparent;font:500 14px inherit;font-family:inherit;color:var(--mut);cursor:pointer}
#nav button.on{color:var(--ink);border-top-color:var(--red);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px 0 4px;padding-bottom:2px}.chips button{flex:none;min-height:42px;padding:6px 14px;border-radius:21px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:500 15px inherit;font-family:inherit;cursor:pointer}.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:1px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}.tag.reg{background:var(--gb);color:var(--grn)}.tag.occ{background:#FFF3D6;color:#8A5A00}.tag.pro{background:#E6EEFA;color:#2F5597}
.crow{display:flex;align-items:center}.crow .row{flex:1;min-width:0}.crow .row small{display:block;color:var(--mut);font-size:14px;font-weight:400}.wa{flex:none;display:flex;align-items:center;justify-content:center;width:52px;align-self:stretch;border-left:1px solid var(--ln);color:var(--grn);text-decoration:none}
#toast{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:8px;font-size:16px;display:none;z-index:6}
</style>

<script>
window.addEventListener('error',e=>{try{if(!(e.lineno>1)||(e.filename&&e.filename!==location.href&&!/^blob:|^about:/.test(e.filename)))return;const m='সমস্যা: '+(e.message||'?')+' (লাইন '+(e.lineno||'?')+')';const s=document.getElementById('st');if(s){s.textContent=m;s.className='st bad'}const t=document.getElementById('toast');if(t){t.textContent=m;t.style.display='block'}}catch(x){}});
window.addEventListener('unhandledrejection',e=>{try{if(!(e.reason&&e.reason.code))return;const r=e.reason;const s=document.getElementById('st');if(s){s.textContent='সমস্যা: '+((r&&(r.code||r.message))||r);s.className='st bad'}}catch(x){}});
let KEY="bakir-khata-c1";
let S={clients:[],tx:[],products:[],stockIn:[]};
S.products=S.products||[];S.stockIn=S.stockIn||[];S.settings=S.settings||{};
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let dbc=null,uid0=null,chain=Promise.resolve(),dirty=new Set(),gone=new Set();
function setSt(t,bad){const s=$("#st");if(s){s.textContent=t;s.className="st"+(bad?" bad":"")}}
const colRef=()=>dbc.collection("users").doc(uid0).collection("khata");
const docBody=cid=>({client:S.clients.find(c=>c.id===cid),tx:S.tx.filter(t=>t.cid===cid)});
const clean=o=>JSON.parse(JSON.stringify(o,(k,v)=>typeof v==='number'&&!isFinite(v)?0:v));
async function put(ref,body){try{await ref.set(clean(body))}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*700));await ref.set(clean(body))}else throw e}}
function flush(){
 if(!dbc)return;
 chain=chain.then(async()=>{
  const ids=[...dirty];dirty.clear();const rm=[...gone];gone.clear();const bad=[];
  for(const id of ids){try{if(id==='stock')await put(colRef().doc('stock'),{products:S.products,stockIn:S.stockIn,settings:S.settings||{}});else{const b=docBody(id);if(b.client)await put(colRef().doc('c_'+id),b)}}catch(e){bad.push([id,(e&&(e.code||e.message))||'?']);if(!(e&&(e.code==='invalid_argument'||e.code==='transform_error')))dirty.add(id)}}

function noteTotal(t){
 t=String(t).replace(/[০-৯]/g,d=>DG.indexOf(d));
 let sum=0;
 t.split(/[/;]+/).forEach(seg=>{
  if(seg.includes("=")){const m=seg.split("=").pop().replace(/,/g,"").match(/-?[0-9]+(?:[.][0-9]+)?/);if(m)sum+=parseFloat(m[0])}
  else{const m=seg.match(/([0-9]+(?:[.][0-9]+)?)[ ]*[*×xX][ ]*([0-9]+(?:[.][0-9]+)?)/);if(m)sum+=parseFloat(m[1])*parseFloat(m[2])}
 });
 return Math.round(sum*100)/100;
}

 }catch(e){setSt("ফোনে সংরক্ষিত। ক্লাউডে সংযোগ হয়নি ("+((e&&e.code)||'?')+")।",1)}
